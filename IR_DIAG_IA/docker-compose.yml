version: '3.8'

services:
  ir-diag:
    build:
      context: .
      dockerfile: Dockerfile
    image: ir-diag:latest
    container_name: ir-diag
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
    env_file:
      - .env
    volumes:
      # Volume persistant : la base SQLite survit aux redémarrages et mises à jour
      - ir-diag-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  ir-diag-data:
    driver: local
